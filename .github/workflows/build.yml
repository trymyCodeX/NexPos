name: Build NexPos APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────
  # JOB 1: NexPos Laundry (Flutter) - App Kasir
  # ──────────────────────────────────────────────────────────
  build-laundry:
    name: NexPos Laundry (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: app-flutter
        run: flutter pub get

      - name: Flutter analyze
        working-directory: app-flutter
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build Debug APK
        working-directory: app-flutter
        run: flutter build apk --debug --no-shrink

      - name: Rename Debug APK
        run: |
          SHORT="${{ github.sha }}"
          SHORT="${SHORT:0:7}"
          mkdir -p app-flutter/build/outputs
          cp app-flutter/build/app/outputs/flutter-apk/app-debug.apk \
             app-flutter/build/outputs/NexPos-Laundry-Debug-${SHORT}.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NexPos-Laundry-Debug-${{ github.sha }}
          path: app-flutter/build/outputs/NexPos-Laundry-Debug-*.apk
          retention-days: 14

      - name: Build Release APK
        if: github.event_name == 'push'
        working-directory: app-flutter
        run: flutter build apk --release --no-shrink

      - name: Rename Release APK
        if: github.event_name == 'push'
        run: |
          SHORT="${{ github.sha }}"
          SHORT="${SHORT:0:7}"
          cp app-flutter/build/app/outputs/flutter-apk/app-release.apk \
             app-flutter/build/outputs/NexPos-Laundry-Release-${SHORT}.apk

      - name: Upload Release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: NexPos-Laundry-Release-${{ github.sha }}
          path: app-flutter/build/outputs/NexPos-Laundry-Release-*.apk
          retention-days: 30

  # ──────────────────────────────────────────────────────────
  # JOB 2: NexPos Admin (Flutter) - App Owner
  # ──────────────────────────────────────────────────────────
  build-admin:
    name: NexPos Admin (Flutter)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Flutter pub get
        working-directory: app-flutter-admin
        run: flutter pub get

      - name: Flutter analyze
        working-directory: app-flutter-admin
        run: flutter analyze --no-fatal-infos
        continue-on-error: true

      - name: Build Debug APK
        working-directory: app-flutter-admin
        run: flutter build apk --debug --no-shrink

      - name: Rename Debug APK
        run: |
          SHORT="${{ github.sha }}"
          SHORT="${SHORT:0:7}"
          mkdir -p app-flutter-admin/build/outputs
          cp app-flutter-admin/build/app/outputs/flutter-apk/app-debug.apk \
             app-flutter-admin/build/outputs/NexPos-Admin-Debug-${SHORT}.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NexPos-Admin-Debug-${{ github.sha }}
          path: app-flutter-admin/build/outputs/NexPos-Admin-Debug-*.apk
          retention-days: 14

      - name: Build Release APK
        if: github.event_name == 'push'
        working-directory: app-flutter-admin
        run: flutter build apk --release --no-shrink

      - name: Rename Release APK
        if: github.event_name == 'push'
        run: |
          SHORT="${{ github.sha }}"
          SHORT="${SHORT:0:7}"
          cp app-flutter-admin/build/app/outputs/flutter-apk/app-release.apk \
             app-flutter-admin/build/outputs/NexPos-Admin-Release-${SHORT}.apk

      - name: Upload Release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: NexPos-Admin-Release-${{ github.sha }}
          path: app-flutter-admin/build/outputs/NexPos-Admin-Release-*.apk
          retention-days: 30

  # ──────────────────────────────────────────────────────────
  # JOB 3: Summary
  # ──────────────────────────────────────────────────────────
  summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [build-laundry, build-admin]
    if: always()
    steps:
      - name: Ringkasan
        run: |
          echo "## NexPos Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Aplikasi | Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|----------|--------|" >> $GITHUB_STEP_SUMMARY
          LAUNDRY="${{ needs.build-laundry.result }}"
          ADMIN="${{ needs.build-admin.result }}"
          [ "$LAUNDRY" = "success" ] && echo "| NexPos Laundry (Kasir) | Flutter | ✅ Berhasil |" >> $GITHUB_STEP_SUMMARY || echo "| NexPos Laundry (Kasir) | Flutter | ❌ Gagal |" >> $GITHUB_STEP_SUMMARY
          [ "$ADMIN" = "success" ] && echo "| NexPos Admin (Owner) | Flutter | ✅ Berhasil |" >> $GITHUB_STEP_SUMMARY || echo "| NexPos Admin (Owner) | Flutter | ❌ Gagal |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Server: `https://nexpos-production-3747.up.railway.app`" >> $GITHUB_STEP_SUMMARY
          echo "Commit: `${{ github.sha }}`" >> $GITHUB_STEP_SUMMARY
